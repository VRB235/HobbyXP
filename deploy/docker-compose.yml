# HobbyXP Web — VPS barato (Docker Compose)
# Uso: copiar .env.example → .env, ajustar secretos, luego:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Requisitos del VPS: Docker + Docker Compose, puertos 80/443 abiertos.
# Dominio opcional: apuntar A/AAAA a la IP del VPS y fijar HOBBYXP_DOMAIN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hobbyxp}
      POSTGRES_USER: ${POSTGRES_USER:-hobbyxp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - hobbyxp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hobbyxp

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-hobbyxp};Username=${POSTGRES_USER:-hobbyxp};Password=${POSTGRES_PASSWORD}
      HobbyXp__MediaRoot: /data/media
      HOBBYXP_DATA_DIR: /data/media
      HobbyXp__Auth__Username: ${HOBBYXP_USER:-admin}
      HobbyXp__Auth__Password: ${HOBBYXP_PASSWORD:?Set HOBBYXP_PASSWORD in .env}
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - hobbyxp_media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hobbyxp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOBBYXP_DOMAIN: ${HOBBYXP_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - hobbyxp

  # Backup diario de Postgres (cron interno). Monta ./backups en el host.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hobbyxp}
      POSTGRES_USER: ${POSTGRES_USER:-hobbyxp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hobbyxp

volumes:
  hobbyxp_pgdata:
  hobbyxp_media:
  caddy_data:
  caddy_config:

networks:
  hobbyxp:
    driver: bridge
